name: kof-security-bot

on:
  push:
    branches: [main, beta-*]
  pull_request:
    branches: [main, beta-*]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  codeql-security:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: CodeQL Security Analysis
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          languages: java
          # security-extended + paths-ignore (src/test) no config espelhado;
          # sem o config, o scan re-gerava os fantasmas dos testes (15/09).
          config-file: .github/codeql/kof4j-security-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3

      - name: Perform CodeQL Security Analysis
        # #563/§386: paths-ignore no config NAO suprime suite importada por
        # `- uses:` (medido 20/09) — filtro real e o pos-SARIF abaixo.
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          category: "/security"
          upload: false
          output: ${{ runner.temp }}/codeql-sarif-security

      - name: Filter src/test out of SARIF (#563)
        run: |
          python3 scripts/codeql-sarif-filter.py --selftest
          python3 scripts/codeql-sarif-filter.py "${{ runner.temp }}/codeql-sarif-security"

      - name: Upload filtered SARIF
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif-security
          category: "/security"
