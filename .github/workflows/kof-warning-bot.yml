name: kof-warning-bot

on:
  push:
    branches: [main, beta-*]
  pull_request:
    branches: [main, beta-*]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am

permissions:
  contents: read

jobs:
  compiler-warnings:
    name: Compiler Warnings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile with -Xlint:all
        run: mvn clean compile -Dmaven.compiler.showWarnings=true -Dmaven.compiler.showDeprecation=true -q 2>&1 | tee warnings.log

      - name: Parse Warnings
        run: |
          if grep -q "warning:" warnings.log; then
            echo "::warning::Compiler warnings detected"
            cat warnings.log
          else
            echo "No compiler warnings"
          fi
