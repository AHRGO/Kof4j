# Secret scanning (defesa em profundidade) — Kof4j
# O GitHub Secret Scanning nativo se habilita em Settings (ver SECURITY.md);
# este job com Gitleaks protege em TODA PR/push/semana, inclusive forks,
# e falha o CI se um segredo real for commitado.
# Alertas nativos (quando habilitados):
# https://github.com/KofLang/Kof4j/security/secret-scanning
name: Secret scan

on:
  push:
    branches: ["**", "!main"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (histórico completo p/ detectar em todo o diff)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
