name: kof-quality-bot

on:
  push:
    branches: [main, beta-*]
  pull_request:
    branches: [main, beta-*]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write
  checks: write

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: CodeQL Code Quality
        uses: github/codeql-action/init@v3
        with:
          languages: java
          # config canônico = security-and-quality + paths-ignore (src/test).
          # SEM o config o scan re-gerava os fantasmas dismissados dos testes
          # (20 alerts 15/09). queries: vem do config, nao duplicar aqui.
          config-file: .github/codeql/kof4j-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/quality"

  security-gate:
    name: CodeQL Gate (alerts API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Automation da frente dev: o bot PERGUNTA ao gate (mesmo
      # scripts/codeql-gate.sh do pre-push) quais alertas estao abertos na
      # branch, em vez de so subir sarif. rc=2 (API fora) = warning, nao fail.
      - name: Run codeql-gate --fast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          bash scripts/codeql-gate.sh --fast | tee gate.log
          rc=${PIPESTATUS[0]}
          echo "gate_rc=$rc" >> "$GITHUB_ENV"
          exit $rc

      - name: Publish gate result (job summary)
        if: always()
        run: |
          {
            echo "## 🛡️ CodeQL gate (Security and quality)"
            echo ""
            case "$gate_rc" in
              0) echo "**Status: GREEN** — 0 alerts open nas branches ativas." ;;
              1) echo "**Status: RED** — alertas open (fix na raiz ou dismiss com evidencia <=280c):**" ;;
              *) echo "**Status: NAO-AVALIADO** (API fora — o scan do CI e a porta real).**" ;;
            esac
            echo ""
            echo '```'
            cat gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          icon=":white_check_mark:"; [ "$gate_rc" = "1" ] && icon=":x:"; [ "$gate_rc" = "2" ] && icon=":warning:"
          body="$icon **CodeQL gate** (\`scripts/codeql-gate.sh\`) — rc=$gate_rc\n\n\`\`\`text\n$(cat gate.log)\n\`\`\`"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("'"$icon"' **CodeQL gate**")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$(printf '%b' "$body")"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$(printf '%b' "$body")"
          fi
