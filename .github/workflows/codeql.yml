# CodeQL — code scanning + code quality (Kof4j)
# Cobre "Code scanning alerts" e "Code quality findings" da aba Security.
# Alertas em: https://github.com/KofLang/Kof4j/security/code-scanning
name: CodeQL

on:
  push:
    branches: [main, beta-0.4.0]
  pull_request:
    branches: [main, beta-0.4.0]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Só java: o repo não tem .js rastreado (JS_COUNT=0) e o job
        # javascript falharia com "no code found". Se .js/.ts entrarem
        # no corpus, readicionar 'javascript' aqui.
        language: [java]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Tooling API baseline)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality + paths-ignore (src/test) no config:
          # harnesses de teste invocam java/gcc/qemu com Strings proprias do
          # teste (relative-path/concatenated-command-line) e trust-all LOCAL
          # (KofWebTlsTest) — nao sao superficie de producao. Ver o config.
          config-file: .github/codeql/kof4j-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
